{% load static %}
<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in</title>
  <link rel="icon" type="image/x-icon" href="{% static 'landing/images/favicon.png' %}">
  <link href="{% static 'css/bootstrap-5.3.3.min.css' %}" rel="stylesheet">
</head>

<body class="min-vh-100 d-flex align-items-center py-4" style="background: #001f20;">
  <main class="container">
    <div class="row justify-content-center">
      <div class="col-12 col-sm-8 col-md-6 col-lg-4">
        <div class="card border-0 shadow-sm p-4">
          <h1 class="h4 mb-3">Sign in</h1>
          {% if form.errors %}
          <div class="alert alert-danger" role="alert">Please enter a correct username and password.</div>
          {% endif %}
          <form method="post">
            {% csrf_token %}
            <input type="hidden" name="next" value="{{ next }}">
            <div class="mb-3">
              <label class="form-label fw-semibold" for="id_username">Username</label>
              <input class="form-control" id="id_username" name="username" type="text"
                value="{{ form.username.value|default:'' }}" required autofocus>
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold" for="id_password">Password</label>
              <input class="form-control" id="id_password" name="password" type="password" required>
            </div>
            <button class="btn btn-success w-100" type="submit">Sign in</button>
          </form>
          <p class="mt-3 mb-0 text-secondary">New here? <a href="{% url 'accounts:signup' %}">Create an account</a>.</p>
          <p class="mt-2 mb-0"><a href="{% url 'portfolio:landing' %}">Back to home</a></p>
        </div>
      </div>
    </div>
  </main>
</body>

</html>

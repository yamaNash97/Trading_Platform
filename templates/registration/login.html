{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5 col-lg-4">
    <div class="panel form-panel">
      <h1 class="h4 mb-3">Sign in</h1>
      <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="btn btn-success w-100" type="submit"><i data-lucide="log-in"></i> Sign in</button>
      </form>
      <p class="mt-3 mb-0 text-secondary">New here? <a href="{% url 'accounts:signup' %}">Create an account</a>.</p>
    </div>
  </div>
</div>
{% endblock %}

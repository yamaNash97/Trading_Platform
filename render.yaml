services:
  - type: web
    name: tradesim
    runtime: python
    plan: free
    buildCommand: bash build.sh
    startCommand: python manage.py migrate --noinput && python manage.py ensure_superuser && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_SUPERUSER_USERNAME
        value: "AdminYama"
      - key: DJANGO_SUPERUSER_EMAIL
        value: "yaman.nashawati@gmail.com"
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
      - key: ALPHA_VANTAGE_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: trading-platform-db
          property: connectionString

databases:
  - name: trading-platform-db
    plan: free

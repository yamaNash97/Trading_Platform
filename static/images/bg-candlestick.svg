<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="candleGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:0.1" />
      <stop offset="50%" style="stop-color:#2ed573;stop-opacity:0.08" />
      <stop offset="100%" style="stop-color:#ff4757;stop-opacity:0.08" />
    </linearGradient>
    
    <filter id="candleGlow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Base -->
  <rect width="1200" height="800" fill="#0f1419"/>
  
  <!-- Gradient overlay -->
  <rect width="1200" height="800" fill="url(#candleGradient)"/>
  
  <!-- Candlestick pattern - representing market data -->
  <g filter="url(#candleGlow)">
    <!-- Green candles (bullish) -->
    <g opacity="0.3">
      <rect x="80" y="350" width="20" height="200" fill="#2ed573" rx="2"/>
      <line x1="90" y1="300" x2="90" y2="580" stroke="#2ed573" stroke-width="2"/>
      
      <rect x="140" y="320" width="20" height="220" fill="#2ed573" rx="2"/>
      <line x1="150" y1="280" x2="150" y2="580" stroke="#2ed573" stroke-width="2"/>
      
      <rect x="260" y="380" width="20" height="160" fill="#2ed573" rx="2"/>
      <line x1="270" y1="350" x2="270" y2="560" stroke="#2ed573" stroke-width="2"/>
      
      <rect x="380" y="340" width="20" height="200" fill="#2ed573" rx="2"/>
      <line x1="390" y1="280" x2="390" y2="580" stroke="#2ed573" stroke-width="2"/>
      
      <rect x="500" y="360" width="20" height="180" fill="#2ed573" rx="2"/>
      <line x1="510" y1="320" x2="510" y2="560" stroke="#2ed573" stroke-width="2"/>
      
      <rect x="680" y="330" width="20" height="220" fill="#2ed573" rx="2"/>
      <line x1="690" y1="270" x2="690" y2="580" stroke="#2ed573" stroke-width="2"/>
      
      <rect x="800" y="380" width="20" height="160" fill="#2ed573" rx="2"/>
      <line x1="810" y1="350" x2="810" y2="560" stroke="#2ed573" stroke-width="2"/>
      
      <rect x="920" y="340" width="20" height="200" fill="#2ed573" rx="2"/>
      <line x1="930" y1="280" x2="930" y2="580" stroke="#2ed573" stroke-width="2"/>
      
      <rect x="1040" y="360" width="20" height="180" fill="#2ed573" rx="2"/>
      <line x1="1050" y1="320" x2="1050" y2="560" stroke="#2ed573" stroke-width="2"/>
    </g>
    
    <!-- Red candles (bearish) -->
    <g opacity="0.25">
      <rect x="110" y="380" width="20" height="160" fill="#ff4757" rx="2"/>
      <line x1="120" y1="350" x2="120" y2="560" stroke="#ff4757" stroke-width="2"/>
      
      <rect x="200" y="400" width="20" height="140" fill="#ff4757" rx="2"/>
      <line x1="210" y1="370" x2="210" y2="560" stroke="#ff4757" stroke-width="2"/>
      
      <rect x="320" y="370" width="20" height="170" fill="#ff4757" rx="2"/>
      <line x1="330" y1="340" x2="330" y2="560" stroke="#ff4757" stroke-width="2"/>
      
      <rect x="440" y="420" width="20" height="120" fill="#ff4757" rx="2"/>
      <line x1="450" y1="400" x2="450" y2="560" stroke="#ff4757" stroke-width="2"/>
      
      <rect x="620" y="390" width="20" height="150" fill="#ff4757" rx="2"/>
      <line x1="630" y1="360" x2="630" y2="560" stroke="#ff4757" stroke-width="2"/>
      
      <rect x="740" y="410" width="20" height="130" fill="#ff4757" rx="2"/>
      <line x1="750" y1="380" x2="750" y2="560" stroke="#ff4757" stroke-width="2"/>
      
      <rect x="860" y="370" width="20" height="170" fill="#ff4757" rx="2"/>
      <line x1="870" y1="340" x2="870" y2="560" stroke="#ff4757" stroke-width="2"/>
      
      <rect x="980" y="400" width="20" height="140" fill="#ff4757" rx="2"/>
      <line x1="990" y1="370" x2="990" y2="560" stroke="#ff4757" stroke-width="2"/>
    </g>
    
    <!-- Cyan candles (neutral/mixed) -->
    <g opacity="0.2">
      <rect x="230" y="390" width="18" height="150" fill="#00d4ff" rx="2"/>
      <line x1="239" y1="360" x2="239" y2="560" stroke="#00d4ff" stroke-width="2"/>
      
      <rect x="560" y="400" width="18" height="140" fill="#00d4ff" rx="2"/>
      <line x1="569" y1="370" x2="569" y2="560" stroke="#00d4ff" stroke-width="2"/>
    </g>
  </g>
  
  <!-- Volatility waves -->
  <g stroke="#00d4ff" stroke-width="1.5" fill="none" opacity="0.15">
    <!-- Wave 1 -->
    <path d="M 50,650 Q 150,550 250,650 T 450,650 T 650,650 T 850,650 T 1050,650 T 1150,650" stroke-linecap="round"/>
    <!-- Wave 2 -->
    <path d="M 50,700 Q 150,600 250,700 T 450,700 T 650,700 T 850,700 T 1050,700 T 1150,700" stroke-linecap="round"/>
  </g>
  
  <!-- Price level indicators (support/resistance) -->
  <g stroke="#2ed573" stroke-width="1" stroke-dasharray="5,5" opacity="0.1">
    <line x1="0" y1="250" x2="1200" y2="250"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="550" x2="1200" y2="550"/>
  </g>
  
  <!-- Moving average line -->
  <polyline points="50,480 150,450 250,420 350,400 450,380 550,370 650,360 750,350 850,345 950,340 1050,335 1150,330" 
            fill="none" stroke="#00d4ff" stroke-width="2" opacity="0.25" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Upper and lower bands (Bollinger effect) -->
  <path d="M 50,380 Q 300,300 600,320 T 1150,280" fill="none" stroke="#2ed573" stroke-width="1.5" opacity="0.15" stroke-dasharray="3,3"/>
  <path d="M 50,580 Q 300,600 600,580 T 1150,620" fill="none" stroke="#ff4757" stroke-width="1.5" opacity="0.15" stroke-dasharray="3,3"/>
  
  <!-- Depth radials -->
  <defs>
    <radialGradient id="depthGlow1" cx="10%" cy="20%">
      <stop offset="0%" style="stop-color:#2ed573;stop-opacity:0.08" />
      <stop offset="100%" style="stop-color:#2ed573;stop-opacity:0" />
    </radialGradient>
    <radialGradient id="depthGlow2" cx="90%" cy="80%">
      <stop offset="0%" style="stop-color:#ff4757;stop-opacity:0.08" />
      <stop offset="100%" style="stop-color:#ff4757;stop-opacity:0" />
    </radialGradient>
  </defs>
  
  <circle cx="150" cy="150" r="500" fill="url(#depthGlow1)"/>
  <circle cx="1050" cy="700" r="500" fill="url(#depthGlow2)"/>
</svg>

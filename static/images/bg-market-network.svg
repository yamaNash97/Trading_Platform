<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="netGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:0.08" />
      <stop offset="100%" style="stop-color:#2ed573;stop-opacity:0.08" />
    </linearGradient>
    
    <filter id="nodeShadow">
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-opacity="0.4" flood-color="#00d4ff"/>
    </filter>
    
    <pattern id="dots" x="60" y="60" width="60" height="60" patternUnits="userSpaceOnUse">
      <circle cx="30" cy="30" r="1" fill="#00d4ff" opacity="0.15"/>
    </pattern>
  </defs>
  
  <!-- Base gradient -->
  <rect width="1200" height="800" fill="#0f1419"/>
  
  <!-- Subtle dot pattern -->
  <rect width="1200" height="800" fill="url(#dots)"/>
  
  <!-- Background gradient mesh -->
  <rect width="1200" height="800" fill="url(#netGradient)"/>
  
  <!-- Network connections -->
  <g stroke="#00d4ff" stroke-width="1" opacity="0.15" stroke-linecap="round">
    <!-- Horizontal connections -->
    <line x1="100" y1="200" x2="350" y2="200"/>
    <line x1="400" y1="200" x2="650" y2="200"/>
    <line x1="700" y1="200" x2="950" y2="200"/>
    <line x1="1000" y1="200" x2="1150" y2="200"/>
    
    <!-- Vertical connections -->
    <line x1="300" y1="100" x2="300" y2="400"/>
    <line x1="600" y1="150" x2="600" y2="500"/>
    <line x1="900" y1="100" x2="900" y2="450"/>
    
    <!-- Diagonal connections -->
    <line x1="100" y1="300" x2="400" y2="500"/>
    <line x1="400" y1="150" x2="800" y2="550"/>
    <line x1="700" y1="600" x2="1100" y2="300"/>
    <line x1="200" y1="600" x2="600" y2="350"/>
    
    <!-- Bottom network -->
    <line x1="150" y1="650" x2="450" y2="650"/>
    <line x1="500" y1="650" x2="800" y2="650"/>
    <line x1="850" y1="650" x2="1150" y2="650"/>
  </g>
  
  <!-- Market nodes (connection points) -->
  <g filter="url(#nodeShadow)">
    <!-- Primary nodes with gradients -->
    <circle cx="150" cy="200" r="6" fill="#00d4ff" opacity="0.7"/>
    <circle cx="300" cy="250" r="5" fill="#2ed573" opacity="0.6"/>
    <circle cx="450" cy="200" r="6" fill="#00d4ff" opacity="0.7"/>
    <circle cx="600" cy="300" r="7" fill="#2ed573" opacity="0.8"/>
    <circle cx="750" cy="200" r="5" fill="#00d4ff" opacity="0.6"/>
    <circle cx="900" cy="250" r="6" fill="#2ed573" opacity="0.7"/>
    <circle cx="1050" cy="200" r="5" fill="#00d4ff" opacity="0.6"/>
    
    <!-- Secondary nodes -->
    <circle cx="200" cy="400" r="4" fill="#00d4ff" opacity="0.5"/>
    <circle cx="400" cy="500" r="4" fill="#2ed573" opacity="0.5"/>
    <circle cx="650" cy="450" r="5" fill="#00d4ff" opacity="0.6"/>
    <circle cx="850" cy="500" r="4" fill="#2ed573" opacity="0.5"/>
    <circle cx="1050" cy="400" r="4" fill="#00d4ff" opacity="0.5"/>
    
    <!-- Bottom tier nodes -->
    <circle cx="200" cy="650" r="5" fill="#2ed573" opacity="0.6"/>
    <circle cx="400" cy="680" r="4" fill="#00d4ff" opacity="0.5"/>
    <circle cx="600" cy="650" r="5" fill="#2ed573" opacity="0.6"/>
    <circle cx="800" cy="680" r="4" fill="#00d4ff" opacity="0.5"/>
    <circle cx="1000" cy="650" r="5" fill="#2ed573" opacity="0.6"/>
  </g>
  
  <!-- Central hub (major market) -->
  <circle cx="600" cy="400" r="15" fill="none" stroke="#00d4ff" stroke-width="2" opacity="0.3"/>
  <circle cx="600" cy="400" r="10" fill="#00d4ff" opacity="0.15"/>
  <circle cx="600" cy="400" r="6" fill="#00d4ff" opacity="0.6"/>
  
  <!-- Radiant gradient overlays for depth -->
  <defs>
    <radialGradient id="radGlow1" cx="15%" cy="15%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#00d4ff;stop-opacity:0" />
    </radialGradient>
    <radialGradient id="radGlow2" cx="85%" cy="85%">
      <stop offset="0%" style="stop-color:#2ed573;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#2ed573;stop-opacity:0" />
    </radialGradient>
  </defs>
  
  <circle cx="200" cy="150" r="400" fill="url(#radGlow1)"/>
  <circle cx="1000" cy="650" r="400" fill="url(#radGlow2)"/>
  
  <!-- Trading indicators floating -->
  <g opacity="0.05" font-family="monospace" font-size="12" fill="#00d4ff">
    <text x="50" y="80">BUY</text>
    <text x="1100" y="750">SELL</text>
    <text x="500" y="100">BULLISH</text>
    <text x="700" y="750">BEARISH</text>
  </g>
</svg>
